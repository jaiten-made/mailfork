# The admin app and cloudflared on a home server. See docs/deployment.md.
#
# No ports are published: cloudflared dials out to Cloudflare, and the admin
# app is reachable only from cloudflared on this Compose network. Settings
# and secrets live outside git in MAILFORK_CONFIG (default
# /etc/mailfork); deploy/ has examples.

name: mailfork

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: mailfork-admin
    restart: unless-stopped
    # About 65 MiB in use on an arm64 server. The heap cap makes Node collect garbage
    # before the container limit kills it.
    mem_limit: 256m
    env_file: ${MAILFORK_CONFIG:-/etc/mailfork}/admin.env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/profiles.db
      NODE_OPTIONS: --max-old-space-size=128
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare-api-token
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2-access-key-id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2-secret-access-key
    secrets:
      - cloudflare-api-token
      - restic-password
      - r2-access-key-id
      - r2-secret-access-key
    volumes:
      - admin-data:/data

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    # About 18 MiB in use on an arm64 server.
    mem_limit: 128m
    # The image already runs `cloudflared --no-autoupdate`.
    command: tunnel run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    depends_on:
      - admin

secrets:
  cloudflare-api-token:
    file: ${MAILFORK_CONFIG:-/etc/mailfork}/cloudflare-api-token
  tunnel-token:
    file: ${MAILFORK_CONFIG:-/etc/mailfork}/tunnel-token
  # Backups (docs/adr/0003). Without the restic password the Backups can't
  # be read, so its source of truth is the Owner's password manager.
  restic-password:
    file: ${MAILFORK_CONFIG:-/etc/mailfork}/restic-password
  r2-access-key-id:
    file: ${MAILFORK_CONFIG:-/etc/mailfork}/r2-access-key-id
  r2-secret-access-key:
    file: ${MAILFORK_CONFIG:-/etc/mailfork}/r2-secret-access-key

volumes:
  admin-data:
