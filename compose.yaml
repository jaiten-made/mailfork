# The admin app and cloudflared on the Raspberry Pi 4. See docs/pi-deployment.md.
#
# No ports are published: cloudflared dials out to Cloudflare, and the admin
# app is reachable only from cloudflared on this Compose network. Settings
# and secrets live outside git in PRIVATE_PROFILE_CONFIG (default
# /etc/private-profile); deploy/ has examples.

name: private-profile

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: private-profile-admin
    restart: unless-stopped
    # About 65 MiB in use on the Pi. The heap cap makes Node collect garbage
    # before the container limit kills it.
    mem_limit: 256m
    env_file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/admin.env
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/profiles.db
      NODE_OPTIONS: --max-old-space-size=128
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare-api-token
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2-access-key-id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2-secret-access-key
    secrets:
      - cloudflare-api-token
      - restic-password
      - r2-access-key-id
      - r2-secret-access-key
    volumes:
      - admin-data:/data

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    # About 18 MiB in use on the Pi.
    mem_limit: 128m
    # The image already runs `cloudflared --no-autoupdate`.
    command: tunnel run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    depends_on:
      - admin

secrets:
  cloudflare-api-token:
    file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/cloudflare-api-token
  tunnel-token:
    file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/tunnel-token
  # Backups (docs/adr/0003). Without the restic password the Backups can't
  # be read, so its source of truth is the Owner's password manager.
  restic-password:
    file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/restic-password
  r2-access-key-id:
    file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/r2-access-key-id
  r2-secret-access-key:
    file: ${PRIVATE_PROFILE_CONFIG:-/etc/private-profile}/r2-secret-access-key

volumes:
  admin-data:
