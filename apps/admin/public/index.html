<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b3123a" />
    <title>Private Profile</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="counter">
      <div class="wrap">
        <h1>Private Profile</h1>
        <form id="create-form" class="create" novalidate>
          <label for="create-label">Label for a new Profile</label>
          <div class="create-row">
            <input
              id="create-label"
              name="label"
              type="text"
              maxlength="100"
              autocomplete="off"
              autocapitalize="sentences"
              enterkeyhint="go"
              placeholder="Such as Shopping"
              required
              aria-describedby="create-error"
            />
            <button type="submit">Create</button>
          </div>
          <p id="create-error" class="error" role="alert" hidden></p>
        </form>
      </div>
    </header>

    <main class="wrap">
      <section id="issued" class="issued" hidden aria-labelledby="issued-heading">
        <h2 id="issued-heading" class="visually-hidden">New Profile Address</h2>
        <div class="ticket ticket-new">
          <div class="ticket-stub">
            <span class="ticket-label" id="issued-label"></span>
          </div>
          <div class="ticket-body">
            <span class="address" id="issued-address"></span>
            <button type="button" class="copy" id="issued-copy">
              <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="11" rx="1.5"/><path d="M13.5 6.5V4a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 4v9A1.5 1.5 0 0 0 5 14.5h1.5"/></svg>
              <span class="copy-text">Copy</span>
            </button>
          </div>
        </div>
        <p class="notice" role="status">
          A new address can take up to a minute to start working. Wait a minute
          before you use it for a signup that sends a verification email.
        </p>
      </section>

      <section aria-labelledby="live-heading">
        <h2 id="live-heading">Live Profiles <span id="live-count" class="count"></span></h2>
        <p id="list-error" class="error" role="alert" hidden></p>
        <p id="empty" class="empty" hidden>
          No Profiles yet. Give one a Label above to get its first address.
        </p>
        <ul id="profiles" class="tickets" aria-busy="true"></ul>
      </section>
    </main>

    <template id="ticket-template">
      <li class="ticket">
        <div class="ticket-stub">
          <span class="ticket-label"></span>
          <time class="created"></time>
          <button type="button" class="rename">Rename</button>
          <form class="rename-form" hidden>
            <label class="visually-hidden">New Label</label>
            <input type="text" name="label" maxlength="100" autocomplete="off" required />
            <div class="rename-actions">
              <button type="submit">Save</button>
              <button type="button" class="cancel">Cancel</button>
            </div>
            <p class="error" role="alert" hidden></p>
          </form>
        </div>
        <div class="ticket-body">
          <span class="address"></span>
          <button type="button" class="copy">
            <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="11" rx="1.5"/><path d="M13.5 6.5V4a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 4v9A1.5 1.5 0 0 0 5 14.5h1.5"/></svg>
            <span class="copy-text">Copy</span>
          </button>
        </div>
      </li>
    </template>
  </body>
</html>
